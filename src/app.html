<!doctype html>
<html lang="en-GB">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Without JavaScript the disclosures stay open and the menu is a plain list -->
		<noscript>
			<style>
				[data-disclosure-panel][hidden] {
					display: block;
				}
				[data-disclosure][aria-controls] {
					pointer-events: none;
				}
				.nav__toggle {
					display: none !important;
				}
			</style>
		</noscript>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
